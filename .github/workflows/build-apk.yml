name: Build Navodaya Vijeta APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build bundled web app
        run: npm run build:capacitor

      - name: Add Android platform if absent
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Ensure Android assets directory exists
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Register Supabase auth deep link
        run: node scripts/configure-android-auth-deeplink.mjs

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: navodaya-vijeta-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
