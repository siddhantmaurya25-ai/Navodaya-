name: Build Navodaya Vijeta APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Published HTTPS URL of the Navodaya Vijeta web app (for example https://your-app.vercel.app)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor Android tooling
        run: |
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Set hosted app URL
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const url = process.env.APP_URL?.trim();
          if (!url || !/^https:\/\//i.test(url)) throw new Error('app_url must be a valid HTTPS URL');
          const u = new URL(url);
          if (u.username || u.password) throw new Error('Do not include credentials in app_url');
          const path = 'capacitor.config.ts';
          let config = fs.readFileSync(path, 'utf8');
          config = config.replace('https://REPLACE-WITH-YOUR-DEPLOYED-APP-URL', u.toString().replace(/\/$/, ''));
          if (config.includes('REPLACE-WITH-YOUR-DEPLOYED-APP-URL')) throw new Error('Could not replace placeholder in capacitor.config.ts');
          fs.writeFileSync(path, config);
          NODE

      - name: Generate Android project
        run: npx cap add android

      - name: Ensure Android assets directory exists
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: navodaya-vijeta-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
